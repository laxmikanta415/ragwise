site_name: ragx
site_description: "Production RAG in 4 lines — hybrid BM25+dense search by default, no Docker"
site_url: https://ragx.readthedocs.io
repo_url: https://github.com/laxmikanta415/ragx
repo_name: laxmikanta415/ragx
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Stores: stores.md
  - API Reference:
      - RAG: api/rag.md
      - Config: api/config.md
  - Guides:
      - Hybrid Search: guides/hybrid-search.md
      - Streaming: guides/streaming.md
      - Agent Tools: guides/agent-tools.md
      - Evaluation: guides/evaluation.md
      - CLI: guides/cli.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
