[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragwise"
version = "0.2.0"
description = "Production-grade RAG in 4 lines — hybrid search, streaming, and agent tools on by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Laxmikanta", email = "lax@insummary.com" },
]
keywords = ["rag", "retrieval", "llm", "hybrid-search", "embeddings", "vector-search", "bm25", "pgvector", "lancedb", "streaming", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "anyio>=4.0",
  "numpy>=1.26",
  "pydantic>=2.0",
  "rank-bm25>=0.2.2",
  "tiktoken>=0.7",
  "openai>=1.30",
  "anthropic>=0.28",
  "chonkie>=0.4",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres  = ["psycopg[async]>=3.1", "pgvector>=0.3"]
lance     = ["lancedb>=0.8"]
local-emb = ["sentence-transformers>=3.0"]
eval      = ["ragas>=0.2", "langfuse>=2.0", "deepeval>=1.0"]
serve     = ["starlette>=0.37", "uvicorn>=0.29", "fastapi>=0.100"]
testing   = ["pytest>=8.0", "pyyaml>=6.0"]
cache     = ["redis>=5.0"]
rerank    = ["cohere>=5.0", "flashrank>=0.2"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
dev = [
  "pytest>=8.0",
  "anyio[trio]>=4.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
ragwise = "cli.main:app"

[project.entry-points."pytest11"]
ragwise_testing = "ragwise.pytest_plugin"

[project.urls]
Homepage = "https://github.com/laxmikanta415/ragwise"
Repository = "https://github.com/laxmikanta415/ragwise"
Issues = "https://github.com/laxmikanta415/ragwise/issues"
Documentation = "https://ragwise.readthedocs.io"
Changelog = "https://github.com/laxmikanta415/ragwise/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragwise", "src/cli"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["redis.*", "cohere.*", "flashrank.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
